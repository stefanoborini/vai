[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vai"
dynamic = ["version", "readme"]
description = "VAI is a console-based IDE similar to VIM"
authors = [
    { name = "Stefano Borini", email = "stefano.borini@gmail.com" },
]
license = { text = "BSD" }
keywords = ["editor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Text Editors",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.4",
]
dependencies = [
    "pygments==2.0.1",
    "pylint==1.3.0",
    "pyflakes==0.8.1",
    "yapsy==1.10.423",
    "vaitk==1.7",
]

[project.urls]
Homepage = "https://github.com/stefanoborini/vai"

[project.scripts]
vai_exec = "vai:main"

[tool.setuptools]
packages = { find = { exclude = ["contrib", "docs", "tests*"] } }
script-files = ["bin/vai"]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "vai.__version__" }
readme = { file = ["DESCRIPTION.rst"], content-type = "text/x-rst" }
